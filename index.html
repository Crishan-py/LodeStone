<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LodeStone</title>
<style>
/* ============================================================ foundation */
:root {
  --ink:      #07080a;
  --panel:    #0e1013;
  --raised:   #14171b;
  --hover:    #1a1e23;
  --edge:     #1e232a;
  --edge-lit: #2b323b;
  --fg:       #e6e9ee;
  --fg-2:     #9aa3ae;
  --fg-3:     #656e7a;
  --brand:    #56d68a;
  --brand-dk: #0c1510;
  --brand-gl: rgba(86,214,138,.14);
  --warn:     #e0b04a;
  --stop:     #e0685e;
  --r:        4px;
  --r-lg:     8px;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --num: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
:root[data-mode="day"] {
  --ink:      #f2f3f5;
  --panel:    #ffffff;
  --raised:   #f7f8fa;
  --hover:    #eceef1;
  --edge:     #e0e4e9;
  --edge-lit: #c9d0d8;
  --fg:       #0f1216;
  --fg-2:     #545c67;
  --fg-3:     #838b96;
  --brand:    #16794a;
  --brand-dk: #ffffff;
  --brand-gl: rgba(22,121,74,.10);
  --warn:     #9a6b12;
  --stop:     #b03a32;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--fg);
  font: 400 14px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 620; }
h1 { font-size: 26px; letter-spacing: -.028em; line-height: 1.15; }
h2 { font-size: 15px; letter-spacing: -.01em; }
::selection { background: var(--brand); color: var(--brand-dk); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--edge-lit); border-radius: 0; }
::-webkit-scrollbar-track { background: var(--ink); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

/* eyebrow: the small uppercase label used everywhere instead of card titles */
.eyebrow {
  font-size: 10px; font-weight: 620; letter-spacing: .14em;
  text-transform: uppercase; color: var(--fg-3);
}

/* ============================================================ top shell */
.rail {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 22px;
  height: 58px; padding: 0 22px;
  background: var(--panel); border-bottom: 1px solid var(--edge);
}
.mark { display: flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; }
.mark img { width: 26px; height: 26px; border-radius: var(--r); image-rendering: pixelated; }
.mark b { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }

.tabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; padding: 8px 13px; border: 0; background: none;
  color: var(--fg-3); font: 550 13px var(--ui); cursor: pointer; white-space: nowrap;
  border-radius: var(--r); transition: color .13s ease, background .13s ease;
}
.tab:hover { color: var(--fg); background: var(--raised); }
.tab[aria-current="page"] { color: var(--fg); background: var(--raised); }
.tab[aria-current="page"]::after {
  content: ""; position: absolute; left: 13px; right: 13px; bottom: -1px;
  height: 2px; background: var(--brand); border-radius: 2px 2px 0 0;
}
.tab .n { font: 600 10px var(--num); color: var(--fg-3); margin-left: 5px; }

.rail-right { display: flex; align-items: center; gap: 10px; }
.pulse { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px;
  border: 1px solid var(--edge); border-radius: 99px; font-size: 11.5px; color: var(--fg-2); }
.pulse i { width: 6px; height: 6px; border-radius: 99px; background: var(--fg-3); }
.pulse.on i { background: var(--brand); animation: beat 2.4s ease-in-out infinite; }
@keyframes beat { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

.launch {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 15px;
  background: var(--brand); color: var(--brand-dk); border: 0; border-radius: var(--r);
  font: 620 13px var(--ui); cursor: pointer; transition: filter .14s ease, opacity .14s ease;
}
.launch:hover:not(:disabled) { filter: brightness(1.1); }
.launch:disabled { opacity: .32; cursor: not-allowed; }

.shell { max-width: 1240px; margin: 0 auto; padding: 26px 22px 64px; }
.head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; }
.head .grow { flex: 1; }
.head p { margin: 5px 0 0; color: var(--fg-2); font-size: 13px; }

/* thin progress bar pinned under the rail */
.prog { position: sticky; top: 58px; z-index: 39; height: 2px; background: transparent; }
.prog i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .3s ease; }

.view { display: none; }
.view.on { display: block; animation: rise .2s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }

/* ============================================================ surfaces */
.ledger {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  background: var(--panel); border: 1px solid var(--edge);
  border-radius: var(--r-lg); overflow: hidden; margin-bottom: 18px;
}
.ledger > div { padding: 15px 17px; border-right: 1px solid var(--edge); }
.ledger > div:last-child { border-right: 0; }
.ledger b { display: block; font: 620 24px var(--num); letter-spacing: -.04em; line-height: 1.1; }
.ledger span { display: block; margin-top: 3px; }

.panel {
  background: var(--panel); border: 1px solid var(--edge);
  border-radius: var(--r-lg); overflow: hidden; margin-bottom: 16px;
}
.panel > header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--edge); background: var(--raised);
}
.panel > header .grow { flex: 1; }
.panel > .body { padding: 16px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

/* row list: table-like, full width dividers, accent edge when active */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; border-bottom: 1px solid var(--edge);
  position: relative; transition: background .13s ease;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--raised); }
.row.sel { background: var(--brand-gl); }
.row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--brand); }
.row .ico {
  width: 34px; height: 34px; flex: none; border-radius: var(--r);
  background: var(--hover); display: grid; place-items: center; overflow: hidden; color: var(--fg-2);
}
.row .ico img { width: 100%; height: 100%; image-rendering: pixelated; }
.row .nm { font-weight: 570; font-size: 13.5px; }
.row .sub { font-size: 11.5px; color: var(--fg-3); margin-top: 1px; }
.row .grow { flex: 1; min-width: 0; }
.cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============================================================ controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 13px; border: 1px solid var(--edge-lit); border-radius: var(--r);
  background: var(--raised); color: var(--fg); font: 550 12.5px var(--ui);
  cursor: pointer; white-space: nowrap; transition: background .13s ease, border-color .13s ease;
}
.btn:hover:not(:disabled) { background: var(--hover); border-color: var(--fg-3); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.go { background: var(--brand); color: var(--brand-dk); border-color: var(--brand); font-weight: 620; }
.btn.go:hover:not(:disabled) { filter: brightness(1.1); }
.btn.flat { background: none; border-color: transparent; color: var(--fg-2); }
.btn.flat:hover:not(:disabled) { background: var(--raised); color: var(--fg); }
.btn.hurt:hover:not(:disabled) { border-color: var(--stop); color: var(--stop); }
.btn.tiny { padding: 4px 9px; font-size: 11.5px; }
.btn svg { width: 14px; height: 14px; flex: none; }
.btn.icon { padding: 5px; }

input[type=text], input[type=password], input[type=number], select, textarea {
  width: 100%; padding: 8px 11px; border-radius: var(--r);
  border: 1px solid var(--edge-lit); background: var(--ink); color: var(--fg);
  font: 400 13px var(--ui); transition: border-color .13s ease;
}
:root[data-mode="day"] input, :root[data-mode="day"] select, :root[data-mode="day"] textarea { background: var(--raised); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
label.fl { display: block; margin-bottom: 5px; }

.seg { display: inline-flex; border: 1px solid var(--edge-lit); border-radius: var(--r); overflow: hidden; }
.seg button {
  padding: 6px 13px; border: 0; border-right: 1px solid var(--edge-lit);
  background: var(--raised); color: var(--fg-2); font: 550 12.5px var(--ui); cursor: pointer;
  transition: background .13s ease, color .13s ease;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--fg); background: var(--hover); }
.seg button.on { background: var(--brand); color: var(--brand-dk); font-weight: 620; }

.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
  border-radius: var(--r); font: 600 10.5px var(--ui); letter-spacing: .03em;
  background: var(--hover); color: var(--fg-2); text-transform: uppercase;
}
.tag.live { background: var(--brand-gl); color: var(--brand); }
.tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.tag.off { background: color-mix(in srgb, var(--stop) 14%, transparent); color: var(--stop); }

.stack { display: flex; flex-direction: column; gap: 13px; }
.inline { display: flex; align-items: center; gap: 8px; }
.inline.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.tiny { font-size: 11.5px; }

.empty { padding: 44px 20px; text-align: center; color: var(--fg-3); }
.empty svg { width: 26px; height: 26px; margin-bottom: 10px; opacity: .5; }
.empty b { display: block; color: var(--fg-2); font-weight: 570; margin-bottom: 4px; }

.code {
  background: var(--ink); border: 1px solid var(--edge); border-radius: var(--r);
  padding: 12px 13px; font: 12px/1.65 var(--num); color: var(--fg-2);
  height: 330px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
:root[data-mode="day"] .code { background: #fbfbfc; }
.code .s { color: var(--fg-3); }

/* ============================================================ overlays */
.scrim {
  position: fixed; inset: 0; z-index: 100; display: none;
  background: rgba(4,5,7,.72); backdrop-filter: blur(2px);
  grid-template-rows: 1fr auto; justify-items: center; padding: 5vh 18px;
}
.scrim.on { display: grid; }
.sheet {
  grid-row: 2; width: min(620px, 100%); max-height: 84vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--edge-lit); border-radius: 10px;
  box-shadow: 0 30px 70px -24px rgba(0,0,0,.8);
  animation: drop .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes drop { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
.sheet > h2 { padding: 15px 18px 0; font-size: 16px; }
.sheet > .in { padding: 15px 18px; display: flex; flex-direction: column; gap: 13px; }
.sheet > .foot { padding: 0 18px 16px; display: flex; gap: 8px; justify-content: flex-end; }
.bad { color: var(--stop); font-size: 12px; }
.bad:empty { display: none; }

.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 200;
  display: flex; flex-direction: column; gap: 7px; max-width: 350px; }
.toast {
  padding: 10px 13px; border-radius: var(--r); border: 1px solid var(--edge-lit);
  background: var(--panel); box-shadow: 0 12px 30px -12px rgba(0,0,0,.7); font-size: 12.5px;
  animation: slide .18s ease;
}
@keyframes slide { from { opacity: 0; transform: translateX(12px) } to { opacity: 1; transform: none } }
.toast.bad { border-color: var(--stop); color: var(--stop); }
.toast.good { border-color: var(--brand); }

@media (max-width: 820px) {
  .rail { flex-wrap: wrap; height: auto; padding: 10px 14px; gap: 10px; }
  .tabs { order: 3; width: 100%; }
  .shell { padding: 18px 14px 48px; }
  .ledger > div { border-right: 0; border-bottom: 1px solid var(--edge); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<header class="rail">
  <a class="mark" href="#" onclick="go('home');return false"><img src="/logo.png" alt=""><b>LodeStone</b></a>
  <nav class="tabs" id="tabs"></nav>
  <div class="rail-right">
    <span class="pulse" id="pulse"><i></i><span>Ready</span></span>
    <button class="launch" id="go-play"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.1-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/></svg>Play</button>
  </div>
</header>
<div class="prog"><i id="prog-bar"></i></div>

<div class="shell">
  <div class="head"><h1 id="title">Home</h1><span class="grow"></span><span id="head-slot" class="inline"></span></div>
  <div id="views"></div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";

/* ==================================================== transport */
const AUTH = decodeURIComponent(location.hash.replace(/^#/, ""));
async function api(method, ...args) {
  try {
    const r = await fetch("/rpc", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Lodestone-Token": AUTH },
      body: JSON.stringify({ method, args }),
    });
    return await r.json();
  } catch (e) {
    console.error(method, e);
    return { success: false, error: "Lost contact with the launcher." };
  }
}
function listen() {
  const s = new EventSource("/events?token=" + encodeURIComponent(AUTH));
  s.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    window.__lodestoneEvent && window.__lodestoneEvent(m.name, m.data);
  };
}

/* ==================================================== kit */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cut = (s, n = 150) => (s && s.length > n ? s.slice(0, n) + "..." : (s || ""));

const I = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
  box: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  cube: '<path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21.5"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  shirt: '<path d="M8 3 4 5.5 5.5 9 8 8v11h8V8l2.5 1L20 5.5 16 3a4 4 0 0 1-8 0z"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  import: '<path d="M12 3v11"/><path d="m8 10 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.1-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  restart: '<path d="M20 11a8 8 0 1 0-1.5 6"/><path d="M20 5v6h-6"/>',
  trash: '<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13h10l1-13"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  find: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  down: '<path d="M12 4v11"/><path d="m8 11 4 4 4-4"/><path d="M4 19h16"/>',
  ok: '<path d="m5 13 4 4L19 7"/>',
  warn: '<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  send: '<path d="M4 12 20 4l-6 16-2-6z"/>',
  cam: '<path d="M3 8h4l2-2h6l2 2h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
};
const ic = (n, s = 16) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="${s}" height="${s}" aria-hidden="true">${I[n] || ""}</svg>`;

const bytes = (n) => {
  n = Number(n) || 0;
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " GB";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n >= 1024) return Math.round(n / 1024) + " KB";
  return n + " B";
};
const dur = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
};
function say(msg, kind = "", ms = 4200) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 180); }, ms);
}

/* ==================================================== state */
let S = { accounts: [], instances: [], running: [], sessions: {}, installing: [],
  playtime_total: 0, active_account: null, active_instance: null,
  settings: { memory_mb: 2048 }, java_ok: false, java_version: null, version: null };
let BUSY = null;
const SIZE = { instances: {}, servers: {} };
const SRV = { list: [], loaded: false, loading: false, sel: null };
const SK = { cat: null, lib: [], me: null };
const DRAFT = { loader: "vanilla", version: null, loaderVersion: null };
const ADDON = { q: "", kind: "mod", hits: [], loading: false };
let WHERE = "home";

const TABS = [
  { id: "home", label: "Home", i: "home" },
  { id: "instances", label: "Instances", i: "box", n: () => S.instances.length },
  { id: "addons", label: "Addons", i: "layers" },
  { id: "skins", label: "Skins", i: "shirt" },
  { id: "servers", label: "Servers", i: "server", n: () => SRV.list.length },
  { id: "import", label: "Import", i: "import" },
  { id: "accounts", label: "Accounts", i: "user", n: () => S.accounts.length },
  { id: "settings", label: "Settings", i: "cog" },
];

// Rebuilding these on every state push destroyed the nodes under the user's
// cursor and reset any open input. Both are updated in place instead, and only
// when their content actually differs.
let tabSig = "";
function tabs() {
  const sig = TABS.map((t) => t.id + (t.n ? ":" + t.n() : "")).join("|") + "|" + WHERE;
  if (sig !== tabSig) {
    tabSig = sig;
    $("#tabs").innerHTML = TABS.map((t) => {
      const n = t.n ? t.n() : 0;
      return `<button class="tab" data-t="${t.id}"${WHERE === t.id ? ' aria-current="page"' : ""}>${t.label}${n ? `<span class="n">${n}</span>` : ""}</button>`;
    }).join("");
  }
  const cur = TABS.find((t) => t.id === WHERE) || TABS[0];
  if ($("#title").textContent !== cur.label) $("#title").textContent = cur.label;
}

const VIEWS = {};
function go(id) {
  WHERE = id;
  tabs();
  $("#views").innerHTML = VIEWS[id] ? VIEWS[id]() : "";
  const v = $("#views").firstElementChild;
  if (v) v.classList.add("on");
  if (VIEWS[id] && VIEWS[id].ready) VIEWS[id].ready();
  // Seed the signature with the state we just rendered. Blanking it here made
  // repaint() see a mismatch, remount the view, and call ready() again -- an
  // endless loop that also restarted the fade-in on every pass, so the view
  // never rose above opacity 0.
  viewSig = viewSignature();
}

// Only redraw the active view when something it renders has really changed.
// The 5s poll must not wipe a search box the user is typing into.
function viewSignature() {
  return [
    S.instances.map((i) => i.name + i.playtime).join(","),
    S.running.join(","), S.installing.join(","),
    S.accounts.map((a) => a.name).join(","),
    (S.active_account || {}).uuid || "", S.active_instance || "",
    JSON.stringify(SIZE.instances), SRV.list.map((x) => x.name).join(","),
    JSON.stringify(SIZE.servers),
  ].join("|");

async function put(pid) {
  if (ADDON.kind === "modpack") {
    const r = await api("install_modpack", pid);
    say(r.success ? "Installing modpack..." : (r.error || "Failed."), r.success ? "good" : "bad");
    return;
  }
  const t = await api("get_addon_targets", ADDON.kind);
  const list = t.success ? (t.instances || t.targets || []) : [];
  if (!list.length) return say("No instance can use this yet.", "bad");
  open("Install to", `
    <div class="tiny faint" id="ad-dep">Checking dependencies...</div>
    <div>${list.map((i) => `<label class="inline" style="cursor:pointer;padding:5px 0">
      <input type="checkbox" value="${esc(i.name)}" checked>
      <span class="grow">${esc(i.name)}</span>
      <span class="tiny faint">${esc(i.version)} · ${esc(i.loader)}</span></label>`).join("")}</div>`, async () => {
    const picked = $$('#sheet input[type=checkbox]:checked').map((x) => x.value);
    if (!picked.length) { say("Pick an instance.", "bad"); return false; }
    for (const n of picked) {
      const r = await api("install_addon", pid, ADDON.kind, n, true);
      if (!r.success) say(n + ": " + (r.error || "failed"), "bad");
    }
    say("Installing.", "good");
  });
  const d = await api("get_addon_dependencies", pid, list[0] && list[0].name);
  const deps = d.success ? (d.dependencies || []) : [];
  const slot = $("#ad-dep");
  if (slot) slot.textContent = deps.length
    ? "Also installs: " + deps.map((x) => typeof x === "string" ? x : (x.title || x.project_id || x.id)).join(", ")
    : "No extra dependencies.";
}

/* ==================================================== servers */

    servers();

  }
  const body = SRV.list.length
    ? `<div class="panel"><div class="rows">${SRV.list.map((s) => {
        const live = S.running.includes(s.name);
        return `<div class="row">
          <div class="ico">${ic("server",17)}</div>
          <div class="grow"><div class="nm cut">${esc(s.name)} ${live ? '<span class="tag live">running</span>' : ""}</div>
            <div class="sub">${esc(s.software || "vanilla")} · ${esc(s.version || "")}${SIZE.servers[s.name] ? " · " + bytes(SIZE.servers[s.name]) : ""}</div></div>
          ${live
            ? `<button class="btn tiny" onclick="srv('${esc(s.name)}','restart')">${ic("restart",13)}</button>
               <button class="btn tiny hurt" onclick="srv('${esc(s.name)}','stop')">${ic("stop",13)} Stop</button>`
            : `<button class="btn tiny go" onclick="srv('${esc(s.name)}','start')">${ic("play",13)} Start</button>`}

      }).join("")}</div></div>`

        <div class="tiny">Spin one up without leaving the launcher.</div>
        <div style="margin-top:14px"><button class="btn go" onclick="newServer()">${ic("plus",14)} New server</button></div></div></div>`;
  return `<section class="view">

      <span class="tiny faint">${SRV.list.length} total</span><span class="grow"></span>
      <button class="btn go" onclick="newServer()">${ic("plus",14)} New server</button>
    </div>${body}</section>`;
};
async function servers() {
  if (SRV.loading) return;
  SRV.loading = true;
  const r = await api("get_servers");
  SRV.list = r.success ? (r.servers || r || []) : [];
  SRV.loading = false;
  SRV.loaded = true;
  if (WHERE === "servers") go("servers");
}
async function srv(n, act) {
  if (act === "start") {
    const e = await api("accept_eula", n);
    if (e && e.success === false && /eula/i.test(e.error || "")) {
      if (!confirm("Accept Mojang's EULA and start?")) return;
      await api("accept_eula", n);
    }
  }
  const m = act === "start" ? "start_server" : act === "restart" ? "restart_server" : "stop_server";
  const r = await api(m, n);
  if (!r.success) say(r.error || "Failed.", "bad");
  else say(act === "stop" ? "Stopping..." : "Starting...", "good");
}
async function newServer() {
  const r = await api("get_server_versions");
  const o = r.success ? (r.versions || r.options || ["vanilla", "paper", "fabric"]) : ["vanilla"];
  open("New server", `
    <div><label class="fl eyebrow" for="ns-n">Name</label><input type="text" id="ns-n" maxlength="40" placeholder="My server"></div>
    <div><label class="fl eyebrow" for="ns-s">Software</label><select id="ns-s">
      ${o.map((x) => { const id = typeof x === "string" ? x : x.id; return `<option>${esc(id)}</option>`; }).join("")}</select></div>
    <div><label class="fl eyebrow" for="ns-v">Version</label><input type="text" id="ns-v" value="latest"></div>
    <div class="bad" id="ns-e"></div>`, async () => {
    const n = $("#ns-n").value.trim();
    if (!n) { $("#ns-e").textContent = "Give it a name."; return false; }
    const rr = await api("create_server", n, $("#ns-s").value, $("#ns-v").value.trim() || "latest");
    if (!rr.success) { $("#ns-e").textContent = rr.error || "Couldn't create."; return false; }
    say("Created " + n, "good");
    SRV.loaded = false;
  });
}
function srvMenu(n) {

async function dropServer(n) {
  close();
  if (!confirm(`Delete server "${n}"?`)) return;
  const r = await api("delete_server", n);
  say(r.success ? "Deleted " + n : (r.error || "Couldn't delete."), r.success ? "good" : "bad");
  SRV.loaded = false;
}
async function console_(n) {
  SRV.sel = n;
  open("Console", `<div class="code" id="cv-log">...</div>
    <div class="inline" style="margin-top:10px"><input type="text" id="cv-cmd" placeholder="Command">
    <button class="btn go" id="cv-send">${ic("send",13)}</button></div>
    <div class="inline wrap" id="cv-who" style="margin-top:10px"></div>`);
  const pull = async () => {
    const l = await api("get_server_log", n);
    if (l.success) {
      const t = l.log || l.text || "";
      const box = $("#cv-log");
      if (box) { box.innerHTML = t.split("\n").map((x) => `<div class="${x.trim().startsWith("[") ? "s" : ""}">${esc(x)}</div>`).join(""); box.scrollTop = box.scrollHeight; }
    }
    const p = await api("get_server_players", n);
    const who = p.success ? (p.players || []) : [];
    const slot = $("#cv-who");
    if (slot) slot.innerHTML = who.length ? who.map((x) => {
      const nm = typeof x === "string" ? x : (x.name || x);
      return `<span class="inline" style="gap:3px"><span class="tag live">${esc(nm)}</span>
        <button class="btn tiny icon flat" data-p="${esc(nm)}" data-a="op" title="Operator">${ic("cog",12)}</button>
        <button class="btn tiny icon flat" data-p="${esc(nm)}" data-a="kick" title="Kick">${ic("x",12)}</button>
        <button class="btn tiny icon flat" data-p="${esc(nm)}" data-a="ban" title="Ban">${ic("warn",12)}</button></span>`;
    }).join("") : `<span class="tiny faint">Nobody online.</span>`;
    $$("[data-p][data-a]").forEach((b) => b.addEventListener("click", async () => {
      const r = await api("player_action", n, b.dataset.p, b.dataset.a);
      say(r.success ? `${b.dataset.a} ${b.dataset.p}` : (r.error || "Failed."), r.success ? "good" : "bad");
    }));
  };
  pull();
  const send = async () => {
    const el = $("#cv-cmd");
    const v = el.value.trim();
    if (!v || !SRV.sel) return;
    const r = await api("send_server_command", SRV.sel, v);
    if (r.success) el.value = "";
  };
  $("#cv-send").addEventListener("click", send);
  $("#cv-cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  window.__cv = setInterval(pull, 2500);
}
async function plugins(n) {
  const r = await api("get_server_content", n);
  const l = r.success ? (r.items || r.plugins || []) : [];
  open("Plugins", l.length
    ? l.map((it) => {
        const fn = typeof it === "string" ? it : (it.filename || it.name);
        const on = typeof it === "object" ? it.enabled !== false : true;
        return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--edge)">
          <span class="grow tiny cut">${esc(fn)}</span>
          <button class="btn tiny" onclick="api('toggle_server_content','${esc(n)}','${esc(fn)}',${!on}).then(()=>say('Toggled.','good'))">${on ? "Enabled" : "Disabled"}</button></div>`;

    : `<div class="tiny faint">No plugins.</div>`);
}
async function srvMods(n) {

/* ==================================================== sheet */
let onSave = null;
function open(title, html, save) {
  onSave = save || null;
  $("#sheet").innerHTML = `<h2>${esc(title)}</h2><div class="in">${html}</div>
    <div class="foot">${onSave
      ? `<button class="btn flat" onclick="close()">Cancel</button><button class="btn go" id="sheet-ok">Save</button>`
      : `<button class="btn flat" onclick="close()">Close</button>`}</div>`;
  $("#scrim").classList.add("on");
  if (onSave) $("#sheet-ok").addEventListener("click", async () => {
    if (await onSave() !== false) close();
  });
}
function close() {
  $("#scrim").classList.remove("on");
  $("#sheet").innerHTML = "";
  onSave = null;
  if (window.__cv) { clearInterval(window.__cv); window.__cv = null; SRV.sel = null; }
}
$("#scrim").addEventListener("click", (e) => { if (e.target === $("#scrim") || e.target.id === "scrim") close(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

/* ==================================================== events */
window.__lodestoneEvent = function (name, data) {
  data = data || {};
  switch (name) {
    case "stateChanged":
      S = data;
      repaint();
      break;
    case "installStarted":
      BUSY = { title: data.title, percent: 0 };
      say(data.title || "Installing...");
      break;
    case "installProgress":
      BUSY = Object.assign({ title: "Installing" }, data);
      repaint();
      break;
    case "installFinished":
      BUSY = null;
      say(data.message || "Done.", "good");
      repaint();
      break;
    case "installError":
      BUSY = null;
      say(data.message || "Install failed.", "bad");
      repaint();
      break;
    case "launchStarted":
      say("Launching " + (data.instance || "") + "...", "good");
      break;
    case "launchEnded":
      say((data.instance || "Game") + " closed.", "good");
      break;
    case "launchError":
      say(data.message || "The game closed unexpectedly.", "bad");
      break;
    case "serverLine":
      if (SRV.sel === data.name) {
        const el = $("#cv-log");
        if (el) { el.insertAdjacentHTML("beforeend", `<div>${esc(data.line || "")}</div>`); el.scrollTop = el.scrollHeight; }
      }
      break;
    case "toast":
      say(data.message || "", data.kind || "");
      break;
  }
};

/* ==================================================== boot */
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-t]");
  if (b) go(b.dataset.t);
});
$("#go-play").addEventListener("click", play);
document.addEventListener("change", (e) => {
  if (e.target.id === "se-m2") {
    // Go through mode() so the persisted name maps to the attribute the CSS
    // actually keys on: light -> day. Setting it raw left every block unmatched.
    mode(e.target.value);
    api("save_settings", { theme: e.target.value });
  }
});
// The stored preference is "light"/"dark"; the attribute the CSS keys on is
// "day"/"dark". Keep the mapping in one place.
function mode(t) {
  document.documentElement.setAttribute("data-mode", t === "light" ? "day" : "dark");
  const sel = $("#se-m2");
  if (sel) sel.value = t === "light" ? "light" : "dark";
}
(async function start() {
  const r = await api("get_state");
  if (r.success && r.state) S = r.state;
  const a = await api("get_disk_usage", "instances");
  if (a.success) SIZE.instances = a.sizes;
  const b = await api("get_disk_usage", "servers");
  if (b.success) SIZE.servers = b.sizes;
  mode(S.settings.theme);
  listen();
  repaint();
  go("home");
  setInterval(async () => {
    const x = await api("get_state");
    if (x.success && x.state) { S = x.state; repaint(); }
  }, 5000);
})();
</script>
