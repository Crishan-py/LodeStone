<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOADSTONE</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --bg: #0a0b0d;
  --surface: #111318;
  --surface-2: #171a20;
  --surface-3: #1e222a;
  --line: #242831;
  --line-soft: #1b1e25;
  --text: #e9ecf1;
  --text-2: #a8b0bc;
  --dim: #6f7783;
  --accent: #93a9c4;
  --accent-ink: #0d1014;
  --accent-soft: rgba(147,169,196,.13);
  --good: #74c294;
  --warn: #d7a94a;
  --bad: #d97f75;
  --r-lg: 14px;
  --r-md: 10px;
  --r-sm: 7px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px -12px rgba(0,0,0,.6);
}
:root[data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f3;
  --line: #dfe3e9;
  --line-soft: #eaedf1;
  --text: #14171c;
  --text-2: #4a515c;
  --dim: #7b838f;
  --accent: #4a6787;
  --accent-ink: #ffffff;
  --accent-soft: rgba(74,103,135,.10);
  --good: #2f8a5b;
  --bad: #b8504a;
  --shadow: 0 1px 2px rgba(16,20,26,.06), 0 8px 24px -14px rgba(16,20,26,.2);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.006em;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.022em; }
h1 { font-size: 22px; }
h2 { font-size: 16px; }
a { color: var(--accent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--line); background-clip: content-box; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------------------------------------------------------------- layout */
.app { display: grid; grid-template-columns: 244px 1fr; min-height: 100vh; }

.side {
  background: var(--surface);
  border-right: 1px solid var(--line-soft);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 20px 18px 18px; }
.brand img { width: 32px; height: 32px; image-rendering: pixelated; border-radius: 5px; }
.brand-text { font-weight: 650; font-size: 15px; letter-spacing: 0.02em; }
.brand-sub { font-size: 11px; color: var(--dim); letter-spacing: 0; }

.nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-sm);
  color: var(--text-2); cursor: pointer; border: 0; background: none;
  font: inherit; text-align: left; width: 100%;
  transition: background .14s ease, color .14s ease;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.on { background: var(--accent-soft); color: var(--text); font-weight: 550; }
.nav-item svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav-item.on svg { opacity: 1; color: var(--accent); }
.nav-count { margin-left: auto; font: 500 11px var(--mono); color: var(--dim); }

.side-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--line-soft); }
.play-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px; border-radius: var(--r-md); border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text); font: 600 14px var(--sans);
  cursor: pointer; transition: background .15s ease, border-color .15s ease;
}
.play-btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--accent); }
.play-btn:disabled { opacity: .45; cursor: not-allowed; }
.side-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--dim); }
.side-meta b { color: var(--text-2); font-weight: 550; font-family: var(--mono); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 0 26px; height: 60px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar .title { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.topbar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--surface); font-size: 12px; color: var(--text-2); cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--dim); }
.chip.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }

.page { padding: 24px 26px 40px; display: none; }
.page.on { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- pieces */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow);
}
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h2 { flex: 1; }
.muted { color: var(--dim); }
.small { font-size: 12px; }
.stat-v { font: 600 26px var(--mono); letter-spacing: -0.03em; }
.stat-l { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin-top: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 13px; border-radius: var(--r-sm); border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text);
  font: 550 13px var(--sans); cursor: pointer; white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }
.iconbtn { padding: 6px; }

.input, .select, textarea.input {
  width: 100%; padding: 9px 11px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  font: 400 13px var(--sans); transition: border-color .15s ease;
}
.input:focus, .select:focus { outline: none; border-color: var(--accent); }
.input::placeholder { color: var(--dim); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.hint { font-size: 11.5px; color: var(--dim); }

.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 46px 20px; color: var(--dim); text-align: center;
}
.empty svg { width: 30px; height: 30px; opacity: .4; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); }
.seg button {
  padding: 6px 13px; border: 0; background: none; color: var(--text-2);
  font: 550 12.5px var(--sans); border-radius: 5px; cursor: pointer; transition: background .14s ease, color .14s ease;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 550; border: 1px solid var(--line); color: var(--text-2); }
.pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.pill.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }

.inst {
  display: flex; align-items: center; gap: 13px; padding: 13px;
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--r-lg); transition: border-color .15s ease, background .15s ease;
}
.inst:hover { border-color: var(--line); }
.inst.on { border-color: var(--accent); background: var(--accent-soft); }
.inst .ico { width: 40px; height: 40px; border-radius: 9px; background: var(--surface-3); display: grid; place-items: center; flex: none; overflow: hidden; }
.inst .ico img { width: 100%; height: 100%; image-rendering: pixelated; }
.inst .ico svg { width: 19px; height: 19px; color: var(--dim); }
.inst .nm { font-weight: 600; font-size: 14px; }
.inst .meta { font-size: 11.5px; color: var(--dim); }
.inst .grow { flex: 1; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bar { height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

.modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
.modal-root.on { display: grid; place-items: center; padding: 24px; }
.modal-bg { position: absolute; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(3px); animation: fade .18s ease; }
.modal {
  position: relative; width: min(560px, 100%); max-height: 86vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 24px 64px -18px rgba(0,0,0,.75); animation: pop .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: none; } }
.modal-h { padding: 18px 20px 0; }
.modal-b { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { padding: 0 20px 18px; display: flex; gap: 9px; justify-content: flex-end; }
.modal h2 { font-size: 17px; }
.err { color: var(--bad); font-size: 12.5px; min-height: 0; }
.err:empty { display: none; }

.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.toast {
  padding: 11px 14px; border-radius: var(--r-md); border: 1px solid var(--line);
  background: var(--surface-2); box-shadow: var(--shadow); font-size: 13px;
  animation: slide .2s cubic-bezier(.2,.9,.3,1);
}
@keyframes slide { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.toast.err { border-color: var(--bad); color: var(--bad); }
.toast.ok { border-color: color-mix(in srgb, var(--good) 40%, transparent); }

.log { background: #0c0e11; border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 12px; font: 12px/1.6 var(--mono); color: #b9c2cc; height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
.log .sys { color: var(--dim); }
.log .err { color: var(--bad); }

.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); border: 1px solid var(--line-soft); margin-bottom: 16px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .2; filter: saturate(.5); }
.hero-in { position: relative; padding: 26px; background: linear-gradient(90deg, var(--surface) 30%, transparent); }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 550; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
table.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); }

.cube { border-radius: 8px; image-rendering: pixelated; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; padding-right: 10px; }
  .nav { flex-direction: row; overflow-x: auto; padding: 0; flex: 1; }
  .side-foot { margin: 0; border: 0; padding: 0 10px; width: 100%; }
  .play-btn { width: auto; padding: 8px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="/logo.png" alt="">
      <div>
        <div class="brand-text">LOADSTONE</div>
        <div class="brand-sub">Minecraft launcher</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="play-btn" id="btn-play">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.1-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/></svg>
        <span id="play-label">Play</span>
      </button>
      <div class="side-meta"><span id="meta-running">0 running</span><span id="meta-time">0m</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="title" id="crumb">Home</span>
      <span class="spacer"></span>
      <span id="topbar-slot" class="row"></span>
      <button class="chip" id="chip-status"><i class="dot"></i><span>Ready</span></button>
    </header>
    <div id="pages"></div>
  </main>
</div>

<div class="modal-root" id="modal-root"><div class="modal-bg" data-close></div><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";

/* ============================================================ transport */
const TOKEN = decodeURIComponent(location.hash.replace(/^#/, ""));
async function callApi(method, ...args) {
  try {
    const res = await fetch("/rpc", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Loadstone-Token": TOKEN },
      body: JSON.stringify({ method, args }),
    });
    return await res.json();
  } catch (err) {
    console.error(method, err);
    return { success: false, error: "Lost contact with the launcher." };
  }
}
function connectEvents() {
  const src = new EventSource("/events?token=" + encodeURIComponent(TOKEN));
  src.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    window.__loadstoneEvent && window.__loadstoneEvent(msg.name, msg.data);
  };
}

/* ============================================================ helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
  box: '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  cube: '<path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7M12 11.5V21.5"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  shirt: '<path d="M8 3 4 5.5 5.5 9 8 8v11h8V8l2.5 1L20 5.5 16 3a4 4 0 0 1-8 0z"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  import: '<path d="M12 3v11"/><path d="m8 10 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.1-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/>',
  trash: '<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-1.5 6"/><path d="M20 5v6h-6"/>',
  check: '<path d="m5 13 4 4L19 7"/>',
  alert: '<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>',
  download: '<path d="M12 4v11"/><path d="m8 11 4 4 4-4"/><path d="M4 19h16"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  edit: '<path d="M4 20h4L20 8l-4-4L4 16z"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  send: '<path d="M4 12 20 4l-6 16-2-6z"/>',
  cam: '<path d="M3 8h4l2-2h6l2 2h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',
};
const icon = (n, s = 17) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="${s}" height="${s}" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const fmtBytes = (n) => {
  n = Number(n) || 0;
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " GB";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n >= 1024) return Math.round(n / 1024) + " KB";
  return n + " B";
};
const fmtTime = (sec) => {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
};
function toast(msg, kind = "", ms = 4200) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 200); }, ms);
}

/* ============================================================ state */
let STATE = { accounts: [], instances: [], servers: [], running: [], sessions: {},
  installing: [], playtime_total: 0, active_account: null, active_instance: null,
  settings: { memory_mb: 2048 }, java_ok: false, java_version: null, version: null };
let PROGRESS = null;
const DISK = { instances: {}, servers: {} };
const SRV = { list: [], sel: null, log: "", pinfo: null };
const SK = { catalog: null, saved: [], local: null, target: null };
const NEW = { loader: "vanilla", version: null, loaderVersion: null };
let ROUTE = "home";

const PAGES = [
  { id: "home", label: "Home", icon: "home" },
  { id: "instances", label: "Instances", icon: "box", count: () => STATE.instances.length },
  { id: "addons", label: "Addons", icon: "layers" },
  { id: "skins", label: "Skins", icon: "shirt" },
  { id: "servers", label: "Servers", icon: "server", count: () => SRV.list.length },
  { id: "import", label: "Import", icon: "import" },
  { id: "accounts", label: "Accounts", icon: "user", count: () => STATE.accounts.length },
  { id: "settings", label: "Settings", icon: "gear" },
];

function renderNav() {

    const n = p.count ? p.count() : 0;
    return `<button class="nav-item${ROUTE === p.id ? " on" : ""}" data-go="${p.id}">
      ${icon(p.icon)}<span>${p.label}</span>${n ? `<span class="nav-count">${n}</span>` : ""}</button>`;
  }).join("");
  $("#crumb").textContent = (PAGES.find((p) => p.id === ROUTE) || PAGES[0]).label;

  ROUTE = id;
  renderNav();
  renderPage();
  const el = document.querySelector(`[data-go="${id}"]`);

}

function renderPage() {
  const pages = $("#pages");
  const keep = pages.querySelector(".page.on");
  if (keep) keep.classList.remove("on");
  const fn = { home: pageHome, instances: pageInstances, addons: pageAddons, skins: pageSkins,
    servers: pageServers, import: pageImport, accounts: pageAccounts, settings: pageSettings }[ROUTE];
  pages.innerHTML = fn ? fn() : "";
  const el = pages.querySelector(".page");
  if (el) el.classList.add("on");
  if (fn && fn.after) fn.after();
}

  const running = STATE.running.length;
  $("#meta-running").textContent = running + " running";
  $("#meta-time").textContent = fmtTime(STATE.playtime_total);

  chip.querySelector("span").textContent = STATE.java_ok ? (running ? "Running" : "Ready") : "No Java";
  renderNav();

}

/* ---- create instance ---- */
async function openCreate() {
  let versions = [];
  const v = await callApi("get_versions");
  if (v.success) versions = v.versions || v;
  const body = `
    <div class="field"><label>Loader</label>
      <div class="seg" id="c-loader">
        <button data-v="vanilla" class="on">Vanilla</button>
        <button data-v="fabric">Fabric</button>
        <button data-v="forge">Forge</button>
      </div></div>
    <div class="field"><label>Minecraft version</label><select class="select" id="c-version"></select></div>
    <div class="field" id="c-loaderwrap" style="display:none"><label>Loader version</label><select class="select" id="c-loaderversion"></select></div>
    <div class="field"><label>Instance name</label><input class="input" id="c-name" placeholder="My instance" maxlength="40"></div>
    <div class="err" id="c-err"></div>`;
  openModal("New instance", body, async () => {
    const name = $("#c-name").value.trim();
    if (!name) { $("#c-err").textContent = "Give it a name."; return false; }
    const r = await callApi("create_instance", NEW.version, NEW.loader, NEW.loaderVersion, name);
    if (!r.success) { $("#c-err").textContent = r.error || "Couldn't create."; return false; }
    toast("Created " + name, "ok");
  });
  const sel = $("#c-version"), lw = $("#c-loaderwrap"), lv = $("#c-loaderversion");
  const fill = () => {
    sel.innerHTML = versions.map((x) => {
      const id = typeof x === "string" ? x : (x.id || x.version);
      return `<option value="${esc(id)}">${esc(id)}</option>`;
    }).join("");
    if (versions.length) { NEW.version = sel.value; sel.onchange = () => { NEW.version = sel.value; refreshLoader(); }; }
    refreshLoader();
  };
  const refreshLoader = async () => {
    if (NEW.loader === "vanilla") { lw.style.display = "none"; NEW.loaderVersion = null; return; }
    lw.style.display = "";
    const r = NEW.loader === "fabric"
      ? await callApi("get_fabric_loaders", NEW.version)
      : await callApi("get_forge_versions", NEW.version);
    const opts = r.success ? (r.loaders || r.versions || []) : [];
    lv.innerHTML = opts.map((x) => {
      const id = typeof x === "string" ? x : (x.loader || x.version || x.id);
      return `<option value="${esc(id)}">${esc(id)}</option>`;
    }).join("");
    NEW.loaderVersion = opts.length ? lv.value : null;
    lv.onchange = () => { NEW.loaderVersion = lv.value; };
    if (!opts.length) $("#c-err").textContent = "No loader builds found for that version.";
  };
  fill();
  $("#c-name").value = "";
  $$("#c-loader button").forEach((b) => b.addEventListener("click", () => {
    $$("#c-loader button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    NEW.loader = b.dataset.v;
    refreshLoader();
  }));
}

    : `<div class="muted small">No screenshots in this instance yet.</div>`;

  $$("[data-shot]").forEach((img) => img.addEventListener("click", async () => {

async function openContent(name) {
  const i = STATE.instances.find((x) => x.name === name);
  const kinds = i && i.loader !== "vanilla" ? ["mods", "resourcepacks", "shaderpacks"] : ["resourcepacks", "shaderpacks"];
  const body = `<div class="seg" id="ct-seg">${kinds.map((k, n) => `<button data-v="${k}" class="${n === 0 ? "on" : ""}">${k.replace(/s$/, "")}</button>`).join("")}</div><div id="ct-list" style="margin-top:14px"></div>`;
  openModal("Content — " + name, body);
  const load = async (kind) => {
    const r = await callApi("get_instance_content", name, kind);
    const items = r.success ? (r.items || r.content || []) : [];
    $("#ct-list").innerHTML = items.length
      ? items.map((it) => {
          const fn = typeof it === "string" ? it : (it.filename || it.name);
          const ver = typeof it === "object" ? (it.version ? " · " + it.version : "") : "";
          return `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line-soft)">

  $$("#ct-seg button").forEach((b) => b.addEventListener("click", () => {
    $$("#ct-seg button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");

  }));
  load(kinds[0]);
}

pageAddons.after = () => {
  const q = $("#ad-q");
  let t;
  q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => { ADDON.q = q.value.trim(); if (ADDON.q.length >= 2) searchAddons(); }, 380);
  });
  $$("#ad-kind button").forEach((b) => b.addEventListener("click", () => {
    $$("#ad-kind button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    ADDON.kind = b.dataset.v;
    if (ADDON.q.length >= 2) searchAddons();
  }));
};
async function searchAddons() {
  ADDON.loading = true;
  $("#ad-list").innerHTML = addonListHtml();
  const r = await callApi("search_addons", ADDON.q, ADDON.kind, ADDON.offset, 30);
  ADDON.loading = false;
  ADDON.results = r.success ? (r.hits || r.results || []) : [];
  if (!r.success) toast(r.error || "Search failed.", "err");
  const el = $("#ad-list");
  if (el) el.innerHTML = addonListHtml();
}
async function installAddon(projectId) {
  if (ADDON.kind === "modpack") {
    const r = await callApi("install_modpack", projectId);
    toast(r.success ? "Installing modpack..." : (r.error || "Failed."), r.success ? "ok" : "err");
    return;
  }
  const targets = await callApi("get_addon_targets", ADDON.kind);
  const insts = targets.success ? (targets.instances || targets.targets || []) : [];
  if (!insts.length) { toast("No instance can use this yet.", "err"); return; }
  openModal("Install to", `
    <div class="hint" id="ad-deps">Checking dependencies...</div>
    <div id="ai-list">${insts.map((i) => `
    <label class="row" style="padding:8px 0;cursor:pointer">
      <input type="checkbox" value="${esc(i.name)}" checked style="accent-color:var(--accent)">
      <span class="grow">${esc(i.name)}</span><span class="muted small">${esc(i.version)} · ${esc(i.loader)}</span>
    </label>`).join("")}</div>`, async () => {
    const picked = $$("#ai-list input:checked").map((x) => x.value);
    if (!picked.length) { toast("Pick at least one instance.", "err"); return false; }
    for (const n of picked) {
      const r = await callApi("install_addon", projectId, ADDON.kind, n, true);
      if (!r.success) toast(n + ": " + (r.error || "failed"), "err");
    }
    toast("Installing.", "ok");
  });
  const d = await callApi("get_addon_dependencies", projectId, insts[0] && insts[0].name);
  const deps = d.success ? (d.dependencies || []) : [];
  const slot = $("#ad-deps");
  if (slot) slot.innerHTML = deps.length
    ? `Also installs: ${deps.map((x) => esc(typeof x === "string" ? x : (x.title || x.project_id || x.id))).join(", ")}`
    : "No extra dependencies.";
}

  }

      </div>

      <button class="btn sm" onclick="saveCurrentSkin()">${icon("plus",14)} Save</button>
      ${installable ? `<button class="btn sm" onclick="installCsl()">${icon("download",14)} Install CSL on ${installable}</button>` : ""}
      <button class="btn sm danger" onclick="resetSkin()">${icon("refresh",14)} Reset</button>
    </div>`;
}
async function loadSavedSkins() {
  const r = await callApi("list_saved_skins");
  const items = r.success ? (r.skins || []) : [];
  SK.saved = items;
  const el = $("#sk-lib");
  if (!el) return;
  el.innerHTML = items.length
    ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px">
        ${items.map((s) => `<div style="text-align:center;position:relative">

          <button class="btn sm ghost iconbtn" data-del="${esc(s.id)}" title="Remove" style="position:absolute;top:3px;right:3px;background:var(--surface-2)">${icon("x",12)}</button>
          <div class="small muted truncate" style="margin-top:4px">${esc(s.name)}</div></div>`).join("")}</div>`
    : `<div>No saved skins yet.</div>`;
  $$("[data-apply]").forEach((i) => i.addEventListener("click", async () => {
    const s = SK.saved.find((x) => x.id === i.dataset.apply);

    toast(res.success ? "Applied." : (res.error || "Failed."), res.success ? "ok" : "err");

    e.stopPropagation();

    loadSavedSkins();
  }));

function pickSkinFile() {
  const inp = document.createElement("input");
  inp.type = "file";

    const b = new FileReader();
    b.onload = async () => {
      const res = await callApi("local_set_skin", b.result, null);
      toast(res.success ? "Applied." : (res.error || "Failed."), res.success ? "ok" : "err");
      if (res.success) loadLocalSkin();

/* ============================================================ servers */
function pageServers() {
  if (!SRV.loaded) {
    // Synchronous on purpose: renderPage assigns the return value straight into
    // the DOM, so an async page function would splice in a Promise.
    loadServers();
    return `<section class="page"><div class="card empty">${icon("server",28)}<div>Loading servers...</div></div></section>`;
  }
  const body = SRV.list.length
    ? `<div class="grid">${SRV.list.map((s) => {
        const live = SRV.running.includes(s.name);
        return `<div class="inst">
          <div class="ico">${icon("server",19)}</div>
          <div class="grow">
            <div class="nm truncate">${esc(s.name)} ${live ? '<span class="pill ok">running</span>' : ""}</div>
            <div class="meta">${esc(s.software || "vanilla")} · ${esc(s.version || "")}${DISK.servers[s.name] ? " · " + fmtBytes(DISK.servers[s.name]) : ""}</div>
          </div>
          <div class="row">
            ${live
              ? `<button class="btn sm" onclick="srvAct('${esc(s.name)}','restart')">${icon("refresh",14)}</button>
                 <button class="btn sm danger" onclick="srvAct('${esc(s.name)}','stop')">${icon("stop",14)} Stop</button>`
              : `<button class="btn sm primary" onclick="srvAct('${esc(s.name)}','start')">${icon("play",14)} Start</button>`}
            <button class="btn sm" onclick="openServer('${esc(s.name)}')">${icon("gear",14)}</button>
          </div>
        </div>`;
      }).join("")}</div>`
    : `<div class="card empty">${icon("server",30)}<div>No servers yet.</div>
       <button class="btn primary" onclick="openCreateServer()">${icon("plus",15)} Create server</button></div>`;
  return `<section class="page">
    <div class="row" style="margin-bottom:14px">
      <span class="muted small">${SRV.list.length} server${SRV.list.length === 1 ? "" : "s"}</span>
      <span style="flex:1"></span>
      <button class="btn primary" onclick="openCreateServer()">${icon("plus",15)} New server</button>
    </div>${body}</section>`;
}
async function loadServers() {
  if (SRV.loading) return;
  SRV.loading = true;
  const r = await callApi("get_servers");
  SRV.list = r.success ? (r.servers || r || []) : [];
  SRV.loading = false;
  SRV.loaded = true;
  if (ROUTE === "servers") renderPage();
}
async function srvAct(name, act) {
  if (act === "start") {
    const eula = await callApi("accept_eula", name);
    if (eula && eula.success === false && /eula/i.test(eula.error || "")) {
      if (!confirm("This server needs Mojang's EULA accepted to start. Accept and continue?")) return;
      await callApi("accept_eula", name);
    }
  }
  const method = act === "start" ? "start_server" : act === "restart" ? "restart_server" : "stop_server";
  const r = await callApi(method, name);
  if (!r.success) toast(r.error || "Failed.", "err");
  else toast(act === "start" ? "Starting..." : act === "restart" ? "Restarting..." : "Stopping...", "ok");
}
async function openCreateServer() {
  const r = await callApi("get_server_versions");
  const opts = r.success ? (r.versions || r.options || ["vanilla", "paper", "fabric"]) : ["vanilla"];
  openModal("New server", `
    <div class="field"><label>Name</label><input class="input" id="sv-name" placeholder="My server" maxlength="40"></div>
    <div class="field"><label>Software</label><select class="select" id="sv-sw">
      ${opts.map((o) => { const id = typeof o === "string" ? o : o.id; return `<option value="${esc(id)}">${esc(id)}</option>`; }).join("")}
    </select></div>
    <div class="field"><label>Version</label><input class="input" id="sv-ver" placeholder="latest"></div>
    <div class="err" id="sv-err"></div>`, async () => {
    const n = $("#sv-name").value.trim();
    if (!n) { $("#sv-err").textContent = "Give it a name."; return false; }
    const res = await callApi("create_server", n, $("#sv-sw").value, $("#sv-ver").value.trim() || "latest");
    if (!res.success) { $("#sv-err").textContent = res.error || "Couldn't create."; return false; }
    toast("Created " + n, "ok");
  });

async function srvConsole(name) {
  SRV.sel = name;
  openModal("Console — " + name, `<div class="log" id="sv-log">Loading...</div>
    <div class="row" style="margin-top:10px"><input class="input" id="sv-cmd" placeholder="Command, e.g. say hello">
    <button class="btn primary" onclick="sendCmd()">${icon("send",14)}</button></div>
    <div id="sv-players" class="row wrap" style="margin-top:10px"></div>`);
  const log = $("#sv-log");
  const pull = async () => {
    const r = await callApi("get_server_log", name);
    if (r.success) {
      const t = r.log || r.text || "";
      log.innerHTML = t.split("\n").map((l) => `<div class="${l.startsWith("[") ? "sys" : ""}">${esc(l)}</div>`).join("");
      log.scrollTop = log.scrollHeight;
    }
    const p = await callApi("get_server_players", name);
    const players = p.success ? (p.players || []) : [];
    const slot = $("#sv-players");
    if (!players.length) {
      slot.innerHTML = `<span class="muted small">No players online.</span>`;
    } else {
      slot.innerHTML = players.map((x) => {
        const pn = typeof x === "string" ? x : (x.name || x);
        return `<span class="row" style="gap:4px"><span class="pill">${esc(pn)}</span>
          <button class="btn sm ghost" data-p="${esc(pn)}" data-a="op" title="Toggle operator">${icon("zap",13)}</button>
          <button class="btn sm ghost" data-p="${esc(pn)}" data-a="kick" title="Kick">${icon("x",13)}</button>
          <button class="btn sm ghost" data-p="${esc(pn)}" data-a="ban" title="Ban">${icon("alert",13)}</button></span>`;
      }).join("");
      $$("[data-p][data-a]").forEach((b) => b.addEventListener("click", async () => {
        const r = await callApi("player_action", name, b.dataset.p, b.dataset.a);
        toast(r.success ? `${b.dataset.a} ${b.dataset.p}` : (r.error || "Failed."), r.success ? "ok" : "err");
      }));
    }
  };
  pull();
  window.__srvPoll = setInterval(pull, 2500);
}
function sendCmd() {
  const el = $("#sv-cmd");
  const v = el.value.trim();
  if (!v || !SRV.sel) return;
  callApi("send_server_command", SRV.sel, v).then((r) => { if (r.success) el.value = ""; });

/* ============================================================ modal */
let modalCb = null;
function openModal(title, bodyHtml, onSave) {
  modalCb = onSave || null;
  $("#modal").innerHTML = `
    <div class="modal-h"><h2>${esc(title)}</h2></div>
    <div class="modal-b">${bodyHtml}</div>
    <div class="modal-f">
      ${modalCb ? `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modal-save">Save</button>` : `<button class="btn" onclick="closeModal()">Close</button>`}
    </div>`;
  $("#modal-root").classList.add("on");
  if (modalCb) $("#modal-save").addEventListener("click", async () => {
    const ok = await modalCb();
    if (ok !== false) closeModal();
  });
}
function closeModal() {
  $("#modal-root").classList.remove("on");
  $("#modal").innerHTML = "";
  modalCb = null;
  if (window.__srvPoll) { clearInterval(window.__srvPoll); window.__srvPoll = null; SRV.sel = null; }
}
$("#modal-root").addEventListener("click", (e) => { if (e.target.hasAttribute("data-close")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* ============================================================ events */
window.__loadstoneEvent = function (name, data) {
  data = data || {};
  switch (name) {
    case "stateChanged":
      STATE = data;
      if (!SRV.loaded) SRV.list = [];
      renderShell();
      break;
    case "installStarted":
      PROGRESS = { title: data.title, percent: 0, current: "Preparing", unit: "bytes", downloaded: 0, total: 1 };
      toast(data.title || "Installing...");
      break;
    case "installProgress":
      if (!PROGRESS) PROGRESS = { title: "Installing" };
      Object.assign(PROGRESS, data);
      renderShell();
      break;
    case "installFinished":
      PROGRESS = null;
      toast(data.message || "Done.", "ok");
      renderShell();
      break;
    case "installError":
      PROGRESS = null;
      toast(data.message || "Install failed.", "err");
      renderShell();
      break;
    case "launchStarted":
      toast("Launching " + (data.instance || "") + "...", "ok");
      break;
    case "launchEnded":
      toast(data.instance + " closed.", "ok");
      break;
    case "launchError":
      toast(data.message || "The game closed unexpectedly.", "err");
      break;
    case "serverLine":
      if (SRV.sel === data.name) {
        const el = $("#sv-log");
        if (el) { el.insertAdjacentHTML("beforeend", `<div>${esc(data.line || "")}</div>`); el.scrollTop = el.scrollHeight; }
      }
      break;
    case "toast":
      toast(data.message || "", data.kind || "");
      break;
  }
};

/* ============================================================ boot */
$("#nav").addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (b) go(b.dataset.go);
});
$("#btn-play").addEventListener("click", playActive);

async function boot() {
  const r = await callApi("get_state");
  if (r.success && r.state) STATE = r.state;
  const d = await callApi("get_disk_usage", "instances");
  if (d.success) DISK.instances = d.sizes;
  const s = await callApi("get_disk_usage", "servers");
  if (s.success) DISK.servers = s.sizes;
  applyTheme(STATE.settings.theme);
  connectEvents();
  renderShell();
  go("home");
  setInterval(async () => {
    const x = await callApi("get_state");
    if (x.success && x.state) { STATE = x.state; renderShell(); }
  }, 5000);
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  const sel = $("#st-theme");
  if (sel) sel.value = t === "light" ? "light" : "dark";
}
// Bound once: applyTheme runs on every state change, and re-binding here
// stacked a duplicate listener each time.
document.addEventListener("change", (e) => {
  if (e.target.id === "st-theme") {
    applyTheme(e.target.value);
    callApi("save_settings", { theme: e.target.value });
  }
});
boot();
</script>
